# Every night: draws the activity card and the contribution snake,
# then publishes both to the "output" branch that README.md points at.
name: Profile activity

on:
  schedule:
    - cron: "23 2 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/activity.yml
      - scripts/build.py
      - scripts/requirements.txt
      - scripts/profile.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/cache@v6
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/build.py') }}
      - run: pip install -r scripts/requirements.txt

      - name: Activity card
        run: python scripts/build.py activity --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#2563EB&color_dots=#EBEFF5,#BFDBFE,#93C5FD,#3B82F6,#1E40AF
            dist/snake-dark.svg?color_snake=#9DC1FF&color_dots=#161B22,#1E3A8A,#2F5FC9,#5B8DEF,#A9C8FF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
          commit_message: Redraw activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
